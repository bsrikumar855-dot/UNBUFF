# Render Blueprint: UNBLUFF backend on Render's free Docker web service.
# Dashboard → New → Blueprint → pick this repo. Render prompts for GEMINI_API_KEY (never committed).
services:
  - type: web
    name: unbluff-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci && npm run build # backend/package-lock.json is in rootDir; ci is reproducible
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: LLM_MODE
        value: live
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.6-flash
      - key: STORE
        value: firestore # durable sessions; production refuses STORE=memory unless ALLOW_EPHEMERAL_STORE=true
      - key: FIREBASE_PROJECT_ID
        sync: false # REQUIRED: your Firebase project id (ID tokens from any other project are rejected)
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false # REQUIRED on Render for Firestore: service-account JSON, entered only in the dashboard
      - key: CORS_ORIGIN
        sync: false # REQUIRED in production (the server refuses to start without it, and rejects "*").
        # Enter the exact deployed frontend origin(s) in the Render dashboard, comma-separated,
        # e.g. https://<your-frontend-origin> (scheme + host, no path, no trailing slash).
      - key: TRUST_PROXY
        value: "1" # Render sits behind one proxy hop; keeps rate limits keyed to the real client IP
      - key: EXECUTION_PROVIDER
        value: none # code Run/Submit reports "unavailable" until a verified Judge0 is configured
      - key: LOG_LEVEL
        value: info
      - key: LLM_DAILY_BUDGET
        value: "150" # model calls per student per UTC day (cost and abuse control)
      - key: MAX_SESSIONS_PER_STUDENT
        value: "50"
      - key: SESSION_RETENTION_DAYS
        value: "365" # audits (with resume text) untouched this long are deleted automatically
      - key: APP_CHECK
        value: "off" # after the frontend is built with VITE_FIREBASE_APPCHECK_SITE_KEY: "monitor" for a few days, then "enforce"
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true" # student features need a verified email; account export/deletion stay available
      - key: MENTOR_TEMPERATURE
        value: "0.7" # conversational tone for the AI mentor (grading and summaries use fixed low temperatures)
      - key: LATEX_COMPILER
        value: none # the Docker LaTeX compiler is development-only and refused in production; the PDF preview reports "unavailable"
      - key: LEETCODE_PUBLIC_LOOKUP
        value: "false" # LeetCode is never contacted unless an operator turns this on
      # GitHub insights are off unless ALL FOUR of these are set (see backend/.env.example). Enter them in the dashboard only.
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_REDIRECT_URI
        sync: false # https://<this service>/api/github/oauth/callback, exactly as registered on the GitHub OAuth app
      - key: GITHUB_FRONTEND_URL
        sync: false # the deployed frontend origin the callback sends the student back to
      - key: GITHUB_TOKEN_ENCRYPTION_KEY
        sync: false # 32 random bytes, base64; encrypts stored GitHub tokens. Generate: openssl rand -base64 32
      - key: GEMINI_API_KEY
        sync: false # entered once in the Render dashboard; never stored in the repo
