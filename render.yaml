# Render Blueprint: UNBLUFF backend on Render's free Docker web service.
# Dashboard → New → Blueprint → pick this repo. Render prompts for GEMINI_API_KEY (never committed).
services:
  - type: web
    name: unbluff-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci && npm run build # backend/package-lock.json is in rootDir; ci is reproducible
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: LLM_MODE
        value: live
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.6-flash
      - key: STORE
        value: firestore # durable sessions; production refuses STORE=memory unless ALLOW_EPHEMERAL_STORE=true
      - key: FIREBASE_PROJECT_ID
        sync: false # REQUIRED: your Firebase project id (ID tokens from any other project are rejected)
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false # REQUIRED on Render for Firestore: service-account JSON, entered only in the dashboard
      - key: CORS_ORIGIN
        sync: false # REQUIRED in production (the server refuses to start without it, and rejects "*").
        # Enter the exact deployed frontend origin(s) in the Render dashboard, comma-separated,
        # e.g. https://<your-frontend-origin> (scheme + host, no path, no trailing slash).
      - key: TRUST_PROXY
        value: "1" # Render sits behind one proxy hop; keeps rate limits keyed to the real client IP
      - key: EXECUTION_PROVIDER
        value: none # code Run/Submit reports "unavailable" until a verified Judge0 is configured
      - key: LOG_LEVEL
        value: info
      - key: GEMINI_API_KEY
        sync: false # entered once in the Render dashboard; never stored in the repo
